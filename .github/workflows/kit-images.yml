name: kit-images

# Builds multi-arch (linux/amd64 + linux/arm64) kit-list images and pushes
# them to ghcr.io/nklisch/agentbox-kits. Three trigger modes:
#
#   push (v* tag)        — release-time. Pushes all 3 tags:
#                            <version>-<sha12>     (immutable)
#                            <version>-<nickname>  (immutable)
#                            latest-<nickname>     (rolling; reassigned)
#   workflow_dispatch    — manual republish at a specified version. Same as push.
#   schedule (daily)     — refresh upstream packages (claude-code, claude-mode,
#                          apt updates, etc.) without an agentbox release.
#                          Resolves version from the latest released v* tag and
#                          pushes ONLY `latest-<nickname>`. Version-pinned tags
#                          stay immutable so users opted into a specific
#                          agentbox version see deterministic kit content.
#
# Cadence matters because @anthropic-ai/claude-code ships multiple times a day.
# A user who installs agentbox on a Wednesday should get a kit image with the
# Wednesday morning claude-code, not the one from the last release.

on:
  push:
    tags: ['v*']
  schedule:
    # Daily at 03:00 UTC. Picks up the prior day's claude-code releases plus
    # any apt-package security updates without churning during US/EU work hours.
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to build under (e.g. v0.3.0). Required for manual runs.'
        required: false

# GITHUB_TOKEN needs packages:write to push to GHCR. contents:read for checkout.
permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      # Let all matrix legs run even if one fails — a broken polyglot build
      # shouldn't block node-claude from shipping.
      fail-fast: false
      matrix:
        # The canonical source of truth is .github/published-kits.yml.
        # GitHub Actions cannot read external files into a matrix at runtime,
        # so the list is duplicated here. The `verify-matrix` step below
        # guards against drift — it fails the job if the two disagree.
        # When adding a new kit list: update BOTH this matrix AND published-kits.yml.
        include:
          - nickname: polyglot-containers-claude
            kits: polyglot,containers,claude
          - nickname: polyglot-containers-codex
            kits: polyglot,containers,codex
          - nickname: polyglot-claude
            kits: polyglot,claude
          - nickname: node-claude
            kits: node,claude

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Full history so `git rev-parse --short HEAD` picks up the actual
          # commit SHA (shallow clone would give a wrong short-sha).
          fetch-depth: 0

      # Resolve the version string once and expose it as a step output so all
      # subsequent steps reference a single source of truth.
      #
      # Also expose `rolling_only`: true on scheduled (cron) runs, false on
      # tag-push or workflow_dispatch. The build-push step uses it to skip
      # the immutable `<version>-<sha12>` and `<version>-<nickname>` tags,
      # leaving them frozen as a record of "what shipped with this release."
      - name: Resolve version
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Take the version from the appropriate source per event type, then
          # strip BOTH the refs/tags/ prefix and the leading v so the published
          # tag is `0.4.0-<sha>`, not `v0.4.0-<sha>`. The CLI's RemoteImageRef
          # also strips the v before composing its lookup ref, so without this
          # the published tag and the CLI's lookup tag mismatch, every pull
          # 404s, and consumers fall back to local build silently. This also
          # matches goreleaser's binary-tarball naming convention (e.g.
          # agentbox_0.4.0_linux_amd64.tar.gz, no v).
          rolling_only=false
          case "${{ github.event_name }}" in
            workflow_dispatch)
              raw="${{ inputs.version }}"
              if [ -z "$raw" ]; then
                # Default to the latest released tag when version input is omitted.
                raw="$(gh release view --json tagName --jq .tagName)"
              fi
              ;;
            schedule)
              # Cron runs aren't tied to a tag; always rebuild against the most
              # recent release so the agentbox binary embedded in CI matches
              # what users actually install. Push only the rolling tag.
              raw="$(gh release view --json tagName --jq .tagName)"
              rolling_only=true
              ;;
            *)
              raw="${GITHUB_REF#refs/tags/}"
              ;;
          esac
          echo "version=${raw#v}" >> "$GITHUB_OUTPUT"
          echo "rolling_only=${rolling_only}" >> "$GITHUB_OUTPUT"

      # Guard: fail loudly if .github/published-kits.yml and the matrix above
      # have drifted. yq is preinstalled on ubuntu-latest runners.
      # This runs per-matrix-leg so the error message names the specific entry
      # that disagrees, making the fix obvious without reading a diff.
      - name: Verify matrix matches published-kits.yml
        shell: bash
        run: |
          declare -A from_yaml
          while IFS=$'\t' read -r nick kits; do
            from_yaml[$nick]=$kits
          done < <(yq -r '.images[] | [.nickname, .kits] | @tsv' .github/published-kits.yml)

          matrix_nick="${{ matrix.nickname }}"
          matrix_kits="${{ matrix.kits }}"
          yaml_kits="${from_yaml[$matrix_nick]}"

          if [ "$yaml_kits" != "$matrix_kits" ]; then
            echo "::error::Matrix entry '$matrix_nick' has kits='$matrix_kits' but .github/published-kits.yml has '$yaml_kits'. Update one to match the other." >&2
            exit 1
          fi
          echo "Matrix entry '$matrix_nick' matches published-kits.yml ✓"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # Build the agentbox CLI with the same ldflags the release workflow uses.
      # The embedded version string becomes part of the Dockerfile header comment
      # and (critically) the version component of the remote image tag via
      # RemoteImageRef — so it must match the published release version.
      - name: Build agentbox CLI
        shell: bash
        run: |
          go build \
            -ldflags "-s -w \
              -X github.com/nklisch/agentbox/internal/version.Version=${{ steps.version.outputs.version }} \
              -X github.com/nklisch/agentbox/internal/version.Commit=$(git rev-parse --short HEAD) \
              -X github.com/nklisch/agentbox/internal/version.Date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o ./agentbox \
            ./cmd/agentbox

      # Stage the build context to disk so docker buildx can consume it via
      # --context. This calls agentbox's resolver + Dockerfile generator, so
      # the context is byte-identical to what a local `agentbox build` produces.
      #
      # --print-tag returns the sha12 portion of the local image tag
      # (agentbox/<sha12>). We strip the prefix and use the hex as the
      # version-pinned component of the GHCR tag, matching what the CLI will
      # compute at pull time via RemoteImageRef.
      - name: Emit build context
        id: emit
        shell: bash
        run: |
          ./agentbox build --emit-context ./build-ctx ${{ matrix.kits }}

          # Compute the sha12 portion of the image tag. --print-tag emits
          # "agentbox/<sha12>" on stdout; strip the "agentbox/" prefix.
          sha12=$(./agentbox build --print-tag ${{ matrix.kits }} | sed 's|agentbox/||')
          echo "sha12=${sha12}" >> "$GITHUB_OUTPUT"

      # QEMU registers binfmt_misc handlers so the amd64 runner can execute
      # arm64 binaries. Required for the linux/arm64 platform leg.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # Buildx creates a multi-platform builder instance. The default docker
      # driver doesn't support --push, so we need the docker-container driver.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Compose the tag list. Tag-push and workflow_dispatch publish all three
      # tags (deterministic + human-readable + rolling). Scheduled runs publish
      # ONLY the rolling tag — the version-pinned tags stay immutable so that
      # `<version>-<sha12>` / `<version>-<nickname>` always reflect the kit
      # content that shipped with that agentbox release.
      - name: Compose image tags
        id: tags
        shell: bash
        run: |
          REPO="ghcr.io/${{ github.repository_owner }}/agentbox-kits"
          ROLLING="${REPO}:latest-${{ matrix.nickname }}"
          if [ "${{ steps.version.outputs.rolling_only }}" = "true" ]; then
            tags="${ROLLING}"
          else
            tags="${REPO}:${{ steps.version.outputs.version }}-${{ steps.emit.outputs.sha12 }}
          ${REPO}:${{ steps.version.outputs.version }}-${{ matrix.nickname }}
          ${ROLLING}"
          fi
          {
            echo 'list<<EOF'
            echo "${tags}"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      # Build and push a multi-arch manifest. Tag set is computed above per
      # event type.
      #
      # Cache strategy:
      #   tag-push / dispatch — read+write the per-nickname GHA cache scope.
      #   schedule (cron)     — write only. Skip cache-from so layers like
      #                          `npm install -g @anthropic-ai/claude-code@latest`
      #                          actually re-resolve from the npm registry.
      #                          Without this, Docker treats the byte-identical
      #                          RUN line as a cache hit and the rolling tag
      #                          ships the same claude-code as yesterday — the
      #                          whole point of the cron is defeated. Still
      #                          writes to cache so the next release run hits
      #                          a warm cache.
      - name: Build and push (multi-arch)
        uses: docker/build-push-action@v7
        with:
          context: ./build-ctx
          file: ./build-ctx/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.list }}
          no-cache: ${{ github.event_name == 'schedule' }}
          # Per-nickname cache scope avoids cross-contamination between kit lists.
          # cache-from suppressed on schedule so npm/curl re-resolve upstream.
          cache-from: ${{ github.event_name == 'schedule' && '' || format('type=gha,scope={0}', matrix.nickname) }}
          cache-to:   type=gha,scope=${{ matrix.nickname }},mode=max
